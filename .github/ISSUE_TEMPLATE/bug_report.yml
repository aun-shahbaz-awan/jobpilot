name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Terminal output or the message shown in the app. Remove any API keys or personal details.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: macOS 15, Node 22, running locally
